<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LGV">
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>

  <!-- Símbolo de la balanza dentro del cuadrado -->
  <g transform="translate(15, 12) scale(0.85)">
    <!-- Línea superior decorativa -->
    <path d="M 30 8 Q 42 -4 54 6 Q 62 12 72 6"
          fill="none" stroke="#A8A8A8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="10" r="3" fill="#A8A8A8"/>

    <!-- Triángulo -->
    <path d="M 30 20 L 70 90 L 30 90 Z"
          fill="none" stroke="#3A2D5C" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Línea vertical -->
    <line x1="30" y1="20" x2="30" y2="105"
          stroke="#3A2D5C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Base semicírculo -->
    <path d="M 0 98 Q 30 125 60 98 Z" fill="#A8A8A8"/>
    <line x1="0" y1="98" x2="60" y2="98"
          stroke="#3A2D5C" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>