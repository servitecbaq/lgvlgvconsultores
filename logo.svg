<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 145" role="img" aria-label="LGV">
  <g transform="translate(15, 10)">

    <!-- Humo superior -->
    <path d="M 28 22
             C 30 8, 46 2, 56 10
             C 64 16, 74 10, 78 4"
          fill="none"
          stroke="#B0B0B0"
          stroke-width="4.5"
          stroke-linecap="round"/>

    <!-- Círculo pequeño -->
    <circle cx="28" cy="26" r="3" fill="#3D2B5C"/>

    <!-- Triángulo exterior -->
    <path d="M 28 30 L 78 105 L 28 105 Z"
          fill="none"
          stroke="#3D2B5C"
          stroke-width="3.5"
          stroke-linejoin="round"/>

    <!-- X interna -->
    <line x1="28" y1="30" x2="78" y2="105"
          stroke="#3D2B5C" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="78" y1="30" x2="28" y2="105"
          stroke="#3D2B5C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Línea superior horizontal -->
    <line x1="28" y1="30" x2="78" y2="30"
          stroke="#3D2B5C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Línea vertical -->
    <line x1="28" y1="26" x2="28" y2="105"
          stroke="#3D2B5C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Líquido gris -->
    <path d="M -2 95 Q 28 130, 58 95 Z" fill="#B0B0B0"/>

    <!-- Línea superior del líquido -->
    <line x1="-2" y1="95" x2="58" y2="95"
          stroke="#3D2B5C" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>